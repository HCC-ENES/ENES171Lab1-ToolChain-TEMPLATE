yaml
name: C++ Build & Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get install -y g++ cmake libgtest-dev

    - name: Build GoogleTest
      run: |
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib

    - name: Build project
      run: make

    - name: Run tests
      run: |
        g++ -std=c++17 -Iinclude tests/test_lab1.cpp -lgtest -lgtest_main -pthread -o tests.out
        ./tests.out
